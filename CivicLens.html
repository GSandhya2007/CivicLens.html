function card(t,k,full){const sim=S.tickets.filter(x=>x.id!==t.id&&x.cat===t.cat&&t.loc&&x.loc.toLowerCase()===t.loc.toLowerCase()).length;
return`<div class="card t c${t.sev}"><div class="row"><span class="id" style="font-size:24px">${t.id}</span>${chip(k,t.sev)}<span class="mute">${new Date(t.at).toLocaleString()}</span></div>
<p>${esc(t.text)}</p><div class="mute">${k.cat}: <b>${N[lang][t.cat]}</b> · ${k.to}: <b>${N[lang][t.cat]}${SUF[lang]}</b><br>${k.why}: ${esc(t.why)}${t.loc?`<br>📍 ${esc(t.loc)}`:""}${t.name?`<br>👤 ${esc(t.name)}`:""}${sim?`<br>⚠ ${sim} ${k.similar}`:""}</div>${t.ph?`<img class="ph" src="${t.ph}" alt="">`:""}
${full?`<div class="row" style="margin-top:10px"><label>${k.status}</label><select onchange="setSt('${t.id}',+this.value)">${[0,1,2].map(i=>`<option value="${i}"${t.st===i?" selected":""}>${stL(k,i)}</option>`).join("")}</select></div>`:`<p><b>${k.status}: ${stL(k,t.st)}</b></p>`}</div>`}
function setSt(id,v){const t=S.tickets.find(x=>x.id===id);if(t){t.st=v;save()}}
async function login(){const k=K[lang],e=$("#em").value.trim().toLowerCase(),a=S.acc[e];if(a&&a.h===await H($("#pw").value)){U=a.d;UE=e;render()}else toast(k.wrong)}
async function signup(){const k=K[lang],e=$("#em").value.trim().toLowerCase(),d=$("#dp").value,p=$("#pw").value;
if(!/^\S+@\S+\.\S+$/.test(e))return toast(k.bademail);if(S.acc[e])return toast(k.exists);if(p.length<6)return toast(k.short);

S.acc[e]={d,h:await H(p)};save();mode="in";render();toast(k.created)}
async function chPw(){const v=$("#np_me").value;if(v.length<6)return toast(K[lang].short);S.acc[UE].h=await H(v);save();$("#np_me").value="";toast(K[lang].saved)}
function delAcc(i){const e=Object.keys(S.acc)[i];if(e&&S.acc[e].d!=="admin"){delete S.acc[e];save();render()}}
function home(k){const n=S.tickets.length,r=S.tickets.filter(t=>t.st===2).length;
return`<div class="card hero"><h2 style="font-size:32px">${k.hh}</h2><p>${k.hs}</p><p><button class="pri" onclick="tab='report';render()">${k.report}</button></p></div>
<div class="g">${[k.s1,k.s2,k.s3,k.s4].map((x,i)=>`<div class="card"><span class="id" style="font-size:26px">${i+1}</span><p>${x}</p></div>`).join("")}</div>
<div class="st" style="grid-template-columns:1fr 1fr"><div class="s1">${k.tot}<b>${n}</b></div><div class="s0">${k.res}<b>${r}</b></div></div>`}
function vote(id){if(S.voted.includes(id))return;const t=S.tickets.find(x=>x.id===id);if(t){t.v=(t.v||0)+1;S.voted.push(id);save();render()}}
function comm(k){const ts=[...S.tickets].sort((a,b)=>(b.v||0)-(a.v||0)||b.at-a.at);
return`<div class="card"><h2>${k.cn}</h2><p class="mute">${k.ch}</p></div>`+(ts.length?ts.map(t=>`<div class="card t c${t.sev}"><div class="row">${chip(k,t.sev)}<b>${N[lang][t.cat]}</b><span class="mute">${stL(k,t.st)}</span></div><p>${esc(t.text)}</p>${t.loc?`<p class="mute">📍 ${esc(t.loc)}</p>`:""}<button onclick="vote('${t.id}')" ${S.voted.includes(t.id)?"disabled":""}>👍 ${k.me2} (${t.v||0})</button></div>`).join(""):`<p class="card">${k.none}</p>`)}
function mineV(k){const mine=S.tickets.filter(t=>S.mine.includes(t.id)).reverse();return`<h2>${k.mine}</h2>`+(mine.length?mine.map(t=>card(t,k,false)).join(""):`<p class="card mute">${k.mn}</p>`)}
function guest(k){const i=mode==="in";
return""+
`<div class="card"><h2>${i?k.login:k.signup}</h2><div class="g"><input id="em" type="email" placeholder="${k.email}" autocomplete="email">${i?"":`<select id="dp">${CK.map((c,j)=>`<option value="${c}">${N[lang][j]}${SUF[lang]}</option>`).join("")}</select>`}<input id="pw" type="password" placeholder="${k.pw}" autocomplete="${i?"current-password":"new-password"}"></div><p class="row"><button class="pri" onclick="${i?"login":"signup"}()">${i?k.login:k.signup}</button><button onclick="mode='${i?"up":"in"}';render()">${i?k.newacc:k.haveacc}</button></p><p class="mute">${k.ahint}</p></div>`}
async function setPw(w){const k=K[lang],v=$("#np_"+w).value;if(v.length<6)return toast(k.short);S.pw[w]=await H(v);save();$("#np_"+w).value="";toast(k.saved)}
function pwRow(k,w,label){return`<div class="row" style="margin-bottom:8px"><span style="min-width:150px">${label} ${S.pw[w]?"✅":"⚪"}</span><input id="np_${w}" type="password" placeholder="${k.setnow}" style="flex:1;min-width:140px" autocomplete="new-password"><button onclick="setPw('${w}')">${k.save}</button></div>`}
function render(){const k=K[lang];$("#tag").textContent=k.tag;$("#lg").value=lang;
$("#nav").innerHTML=[["home",k.home],["report",k.report],["track",k.track],["dash",k.dash],["comm",k.comm],["auth",k.auth]].map(([i,l])=>`<button class="${tab===i?"on":""}" onclick="tab='${i}';render()">${l}</button>`).join("");let h="";
if(tab==="home"){h=home(k)}else if(tab==="report"){h=R?`<div class="card"><p class="mute">${k.id}</p><div class="id">${R.id}</div></div>${card(R,k,false)}<div class="row"><button onclick="say('${R.id.split("").join(" ")}')">🔊 ${k.listen}</button><button class="pri" onclick="R=null;render()">${k.another}</button></div>`
:`<div class="card"><h2>${k.report}</h2><textarea id="tx" placeholder="${k.describe}" oninput="D.text=this.value">${esc(D.text)}</textarea>
<div class="row" style="margin:10px 0"><button id="mic" class="mic${rec?" on":""}" onclick="mic()" aria-label="Voice">🎤</button><span class="mute">${k.describe}</span></div>
<div class="g"><input placeholder="${k.name}" value="${esc(D.name)}" oninput="D.name=this.value"><input placeholder="${k.loc}" value="${esc(D.loc)}" oninput="D.loc=this.value"></div>
<p class="mute" style="margin:12px 0 4px">${k.photo}</p><input id="ph" type="file" accept="image/*"><p><button class="pri" onclick="submit()">${k.submit}</button></p></div>`}
else if(tab==="track"){const q=($("#q")||{}).value;h=`<div class="card"><h2>${k.track}</h2><div class="row"><input id="q" placeholder="${k.enterId}" style="flex:1" value="${esc(window.Q||"")}"><button class="pri" onclick="window.Q=$('#q').value.trim().toUpperCase();render()">${k.find}</button></div></div>`;
if(window.Q){const t=S.tickets.find(x=>x.id===window.Q);h+=t?card(t,k,false):`<p class="card">${k.nf}</p>`}}
else if(tab==="comm"){h=comm(k)}else if(tab==="dash"){h=mineV(k)}else if(!U){h=guest(k)}
else{const ts=S.tickets.filter(t=>U==="admin"?(F==="all"||CK[t.cat]===F):CK[t.cat]===U).sort((a,b)=>b.sev-a.sev||a.at-b.at),c=[0,1,2,3].map(i=>ts.filter(t=>t.sev===i&&t.st<2).length);
h=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">${U==="admin"?k.admin:N[lang][CK.indexOf(U)]+SUF[lang]}</h2><button onclick="U=null;UE=null;render()">${k.logout}</button></div><p class="mute">${esc(UE||"")}</p>
<div class="st">${[3,2,1,0].map(i=>`<div class="s${i}">${sevL(k,i)}<b>${c[i]}</b></div>`).join("")}</div>
${U==="admin"?`<div class="card"><h2>${k.auth}</h2>${Object.keys(S.acc).filter(e=>S.acc[e].d!=="admin").map(e=>`<div class="row" style="margin-bottom:6px"><span style="flex:1">${esc(e)} · ${N[lang][CK.indexOf(S.acc[e].d)]}</span><button onclick="delAcc(${Object.keys(S.acc).indexOf(e)})">✕</button></div>`).join("")||"—"}</div><select style="margin-bottom:12px" onchange="F=this.value;render()"><option value="all">${k.all}</option>${CK.map((x,i)=>`<option value="${x}"${F===x?" selected":""}>${N[lang][i]}</option>`).join("")}</select>`:``}
<div class="card"><div class="row"><input id="np_me" type="password" placeholder="${k.mypw}" style="flex:1" autocomplete="new-password"><button onclick="chPw()">${k.cpw}</button></div></div>${ts.length?ts.map(t=>card(t,k,true)).join(""):`<p class="card">${k.none}</p>`}`}
const sv={x:window.scrollY};$("#app").innerHTML=h}
render();
</script></body></html>
